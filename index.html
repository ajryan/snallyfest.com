  <body>
    <!-- ============================================================
       HERO — eye artwork background
       ============================================================ -->
    <section class="eye-hero" aria-label="Snallyfest">
      <div class="eye-hero-bg"></div>
      <div class="eye-hero-overlay"></div>
      <div class="eye-hero-content">
        <div class="eye-hero-brand">
          <h1 class="hero-logo-wrap">
            <img
              src="assets/logo.png"
              alt="Snallyfest"
              class="hero-logo"
              width="534"
              height="107"
            />
          </h1>
          <img
            src="assets/location.png"
            alt="Frederick, Maryland"
            class="hero-location-img"
            width="531"
            height="54"
          />
        </div>

        <!-- ============================================================
           EMAIL SIGNUP
           Live Mailchimp form — submits via JSONP (see script.js)
           ============================================================ -->
        <div class="eye-hero-signup" id="signup" aria-label="Email signup">
          <h2 class="section-title">STAY IN THE LOOP</h2>
          <p class="section-sub">
            Get lineup updates, ticket drops, fest news, and volunteer
            opportunities.
          </p>
          <form
            class="signup-form"
            id="signup-form"
            action="https://live.us3.list-manage.com/subscribe/post"
            method="POST"
            novalidate
          >
            <!-- Mailchimp account + list identifiers -->
            <input type="hidden" name="u" value="7da2a0439c6a52a792d36f098" />
            <input type="hidden" name="id" value="312bc5fdbb" />

            <!-- Mailchimp honeypot — must stay hidden, do not remove -->
            <div
              class="mc-honeypot"
              aria-hidden="true"
              aria-label="Please leave the following three fields empty"
            >
              <input type="text" name="b_name" tabindex="-1" value="" />
              <input type="email" name="b_email" tabindex="-1" value="" />
              <textarea name="b_comment" tabindex="-1"></textarea>
            </div>

            <div class="signup-row">
              <label for="signup-fname" class="sr-only">First name</label>
              <input
                id="signup-fname"
                type="text"
                name="MERGE1"
                placeholder="First name"
                required
                autocomplete="given-name"
              />
              <label for="signup-lname" class="sr-only">Last name</label>
              <input
                id="signup-lname"
                type="text"
                name="MERGE2"
                placeholder="Last name"
                required
                autocomplete="family-name"
              />
            </div>
            <label for="signup-email" class="sr-only">Email address</label>
            <input
              id="signup-email"
              type="email"
              name="MERGE0"
              placeholder="your@email.com"
              required
              autocomplete="email"
            />
            <label class="signup-consent">
              <input
                type="checkbox"
                name="group[27871][1]"
                value="1"
                required
              />
              <span>Add me to the Snallyfest mailing list</span>
            </label>
            <button
              type="submit"
              class="btn btn-secondary"
              data-umami-event="email-signup"
            >
              Subscribe
            </button>
          </form>
        </div>

        <div class="eye-hero-bottom">
          <div class="eye-hero-cta">
            <a href="snallyfest-2026.html" class="btn btn-primary">
              Snallyfest 2026
            </a>
          </div>
